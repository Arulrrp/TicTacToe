<div class="board" role="grid" aria-label="Tic Tac Toe board">
  <button
    *ngFor="let cell of board; let i = index"
    type="button"
    class="cell"
    [class.winning]="isWinningCell(i)"
    [class.x]="cell === 'X'"
    [class.o]="cell === 'O'"
    [disabled]="!isClickable(i)"
    [attr.aria-label]="'Row ' + rowOf(i) + ' Column ' + colOf(i)"
    (click)="onCellClick(i)"
  >
    {{ cell }}
  </button>
</div>
